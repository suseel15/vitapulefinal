[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vitapulse-backend"
version = "0.1.0"
description = "VitaPulse protected API foundation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "ocrmypdf @ git+https://github.com/ocrmypdf/OCRmyPDF.git@10b37915410d63b82a808b15add3ca7288e106f7",
  "pypdf>=5.1,<7.0",
  "pydantic-settings>=2.7,<3.0",
  "python-multipart>=0.0.18,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
]
ml-training = [
  "scikit-learn>=1.6,<2.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["datasets*", "tests*"]

[tool.vercel.scripts]
build = "python build_frontend.py"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
